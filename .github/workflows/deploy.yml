name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install build tools
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Restore thumbnail cache
        uses: actions/cache@v4
        with:
          path: .thumb-cache
          key: thumbs-${{ github.run_id }}
          restore-keys: thumbs-

      - name: Build model list and thumbnails
        run: node scripts/build.mjs --thumbnails

      - name: Collect site files
        run: |
          mkdir _site
          rsync -a ./ _site/ \
            --exclude .git --exclude .github --exclude node_modules \
            --exclude .thumb-cache --exclude _site --exclude scripts \
            --exclude 'package*.json'
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
